# Drop-in for aegis.service when a public app relies on enforcement
# (cobblebob's public Q&A). Install as:
#   ~/.config/systemd/user/aegis.service.d/public-enforce.conf
# with deploy/public-enforce.env copied to ~/.config/aegis/public-enforce.env.
#
# EnvironmentFile entries are read in order and later ones win, so these
# settings override aegis.env without touching it (it holds ADMIN_TOKEN).
# Roll back by removing this drop-in, daemon-reload and restarting aegis.
[Service]
EnvironmentFile=%h/.config/aegis/public-enforce.env
# New audit DB/journal files readable by the owner only.
UMask=0077
