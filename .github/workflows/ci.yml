name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and lint (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --extra dev --python 3.11

      - name: Lint
        run: |
          uv run ruff check app demo tests
          uv run ruff format --check app demo tests

      - name: Test
        run: uv run pytest --cov=app --cov=demo --cov-report=term-missing --cov-fail-under=40
